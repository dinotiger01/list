name: Windows Qt/CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6 & SQLite via vcpkg
        run: |
          # Use vcpkg (pre-installed on the runner) to explicitly install required packages
          vcpkg install qtbase qtdeclarative qtsvg sqlite3 --triplet x64-windows

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Pass the vcpkg toolchain file so CMake locates everything automatically
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/hostedtoolcache/windows/vcpkg/vcpkg.cmake"

      - name: Build Application
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy and Bundle Dependencies (windeployqt)
        shell: pwsh
        run: |
          $exePath = "build/Release/List.exe"
          
          # Locate where vcpkg built the windeployqt tool
          $windeployqtPath = "C:/hostedtoolcache/windows/vcpkg/installed/x64-windows/tools/qt5/windeployqt.exe"
          if (-not (Test-Path $windeployqtPath)) {
              $windeployqtPath = "C:/hostedtoolcache/windows/vcpkg/installed/x64-windows/tools/qt6/windeployqt.exe"
          }
          
          # Bundle DLLs, modules, and plugins
          & $windeployqtPath --release --qml_dir QML --compiler-runtime $exePath

      - name: Copy Assets (SQL & SVG)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/Release/SQL"
          New-Item -ItemType Directory -Force -Path "build/Release/SVG"
          if (Test-Path "SQL") { Copy-Item -Path "SQL\*" -Destination "build\Release\SQL" -Recurse -Force }
          if (Test-Path "SVG") { Copy-Item -Path "SVG\*" -Destination "build\Release\SVG" -Recurse -Force }

      - name: Archive Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/Release/*" -DestinationPath "build/List-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: build/List-Windows.zip
