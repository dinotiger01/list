name: Windows Qt/CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      # Direct vcpkg to use binary cache folders to prevent recompiles on subsequent pushes
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Enable GitHub vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-

      - name: Install SQLite via vcpkg
        run: |
          # Only compile light, dependency-free sqlite3 to bypass the heavy qtdeclarative build wall
          vcpkg install sqlite3 --triplet x64-windows

      - name: Install Pre-compiled Qt6 via Official Alternative Pipeline
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtdeclarative qtsvg'
          arch: 'win64_msvc2022_64'
          # Force a fallback public open-source mirror to completely bypass the crashing XML index
          mirror: 'https://berkeley.edu'

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # We hook up BOTH vcpkg (for SQLite3) and QT_ROOT_DIR (for pre-compiled Qt6)
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" `
            -DCMAKE_TOOLCHAIN_FILE="C:/hostedtoolcache/windows/vcpkg/vcpkg.cmake"

      - name: Build Application
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy and Bundle Dependencies (windeployqt)
        shell: pwsh
        run: |
          $exePath = "build/Release/List.exe"
          $windeployqtPath = "${{ env.QT_ROOT_DIR }}/bin/windeployqt.exe"
          
          # Bundle DLLs, modules, and plugins seamlessly using the precompiled binary tool
          & $windeployqtPath --release --qml_dir QML --compiler-runtime $exePath

      - name: Copy Assets (SQL & SVG)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/Release/SQL"
          New-Item -ItemType Directory -Force -Path "build/Release/SVG"
          if (Test-Path "SQL") { Copy-Item -Path "SQL\*" -Destination "build\Release\SQL" -Recurse -Force }
          if (Test-Path "SVG") { Copy-Item -Path "SVG\*" -Destination "build\Release\SVG" -Recurse -Force }

      - name: Archive Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/Release/*" -DestinationPath "build/List-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: build/List-Windows.zip
