name: Windows Qt/CMake Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          cache: true



      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y

          $env:PATH = "C:\mingw64\bin;$env:PATH"

          Write-Host "========================================"
          Write-Host "Compiler"
          Write-Host "========================================"

          gcc --version
          g++ --version



      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-mingw-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-mingw-


      - name: Install SQLite
        shell: pwsh
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ github.workspace }}/vcpkg-cache"

          $env:VCPKG_DEFAULT_BINARY_CACHE = `
            "${{ github.workspace }}/vcpkg-cache"

          Write-Host "========================================"
          Write-Host "Installing SQLite"
          Write-Host "========================================"

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" `
            install sqlite3:x64-mingw-static

          if ($LASTEXITCODE -ne 0) {
            Write-Error "SQLite installation failed!"
            exit 1
          }

          Write-Host "SQLite installed."

      - name: Show vcpkg packages
        shell: pwsh
        run: |

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" list


      - name: Configure CMake
        shell: pwsh
        run: |

          Write-Host "========================================"
          Write-Host "CMake configuration"
          Write-Host "========================================"

          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Qt directory:"
          Write-Host $env:Qt6_DIR

          Write-Host ""
          Write-Host "vcpkg:"
          Write-Host $env:VCPKG_INSTALLATION_ROOT

          cmake `
            -S . `
            -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit 1
          }

      - name: Build Application
        shell: pwsh
        run: |

          Write-Host "========================================"
          Write-Host "Building List"
          Write-Host "========================================"

          cmake `
            --build build `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            exit 1
          }

      - name: Find executable
        shell: pwsh
        run: |

          Write-Host "========================================"
          Write-Host "Searching for executable"
          Write-Host "========================================"

          Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.exe"

          if (!(Test-Path "build/List.exe")) {
            Write-Error "List.exe was not found!"
            exit 1
          }

          Write-Host ""
          Write-Host "List.exe found!"

      - name: Deploy Qt dependencies
        shell: pwsh
        run: |

          $exePath = "${{ github.workspace }}/build/List.exe"

          if (!(Test-Path $exePath)) {
            Write-Error "Executable not found!"
            exit 1
          }

          Write-Host "========================================"
          Write-Host "Deploying Qt"
          Write-Host "========================================"

          windeployqt `
            --release `
            --qmldir "${{ github.workspace }}/QML" `
            "$exePath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "windeployqt failed!"
            exit 1
          }

      - name: Copy SQL assets
        shell: pwsh
        run: |

          if (Test-Path "SQL") {

            Write-Host "Copying SQL directory..."

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "build/SQL"

            Copy-Item `
              -Path "SQL/*" `
              -Destination "build/SQL" `
              -Recurse `
              -Force

          }
          else {

            Write-Host "No SQL directory found."

          }

      - name: Copy SVG assets
        shell: pwsh
        run: |

          if (Test-Path "SVG") {

            Write-Host "Copying SVG directory..."

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "build/SVG"

            Copy-Item `
              -Path "SVG/*" `
              -Destination "build/SVG" `
              -Recurse `
              -Force

          }
          else {

            Write-Host "No SVG directory found."

          }



      - name: Show final build
        shell: pwsh
        run: |

          Write-Host "========================================"
          Write-Host "FINAL BUILD CONTENTS"
          Write-Host "========================================"

          Get-ChildItem `
            -Path build `
            -Recurse



      - name: Create Windows ZIP
        shell: pwsh
        run: |

          if (!(Test-Path "build/List.exe")) {
            Write-Error "List.exe is missing!"
            exit 1
          }

          Compress-Archive `
            -Path "build/*" `
            -DestinationPath "build/List-Windows.zip" `
            -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ZIP CREATED"
          Write-Host "========================================"

          Get-Item "build/List-Windows.zip"
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: build/List-Windows.zip
          if-no-files-found: error