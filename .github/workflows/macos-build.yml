name: Windows Qt/CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install SQLite via vcpkg
        run: |
          mkdir -Force "${{ github.workspace }}/vcpkg-cache"
          vcpkg install sqlite3 --triplet x64-windows

      - name: Install Native Qt6 Framework via Chocolatey
        run: |
          # Pulls verified native open-source Windows components directly into the runner environment
          choco install qt6-base-dev -y

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Point CMAKE_PREFIX_PATH to Chocolatey's standard installation target for Qt6
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:/tools/Qt6" `
            -DCMAKE_TOOLCHAIN_FILE="C:/hostedtoolcache/windows/vcpkg/vcpkg.cmake"

      - name: Build Application
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy and Bundle Dependencies (windeployqt)
        shell: pwsh
        run: |
          $exePath = "build/Release/List.exe"
          $windeployqtPath = "C:/tools/Qt6/bin/windeployqt.exe"
          
          # Package Windows DLL dependencies seamlessly
          & $windeployqtPath --release --qml_dir QML --compiler-runtime $exePath

      - name: Copy Assets (SQL & SVG)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/Release/SQL"
          New-Item -ItemType Directory -Force -Path "build/Release/SVG"
          if (Test-Path "SQL") { Copy-Item -Path "SQL\*" -Destination "build\Release\SQL" -Recurse -Force }
          if (Test-Path "SVG") { Copy-Item -Path "SVG\*" -Destination "build\Release\SVG" -Recurse -Force }

      - name: Archive Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/Release/*" -DestinationPath "build/List-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: build/List-Windows.zip
