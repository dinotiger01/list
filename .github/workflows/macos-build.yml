name: Windows Qt/CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtdeclarative'
          arch: 'win64_msvc2022_64'

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build Application
        run: |
          cd build
          cmake --build . --config Release

      - name: Deploy and Bundle Qt Dependencies (windeployqt)
        shell: pwsh
        run: |
          $exePath = "build/Release/List.exe"
          $windeployqtPath = "${{ env.QT_ROOT_DIR }}/bin/windeployqt.exe"
          
          # Run windeployqt to copy DLLs, QML modules, and plugins automatically
          & $windeployqtPath --release --qml_dir QML --compiler-runtime $exePath

      - name: Copy Assets (SQL & SVG)
        shell: pwsh
        run: |
          # Ensure targeted release directory structure exists
          New-Item -ItemType Directory -Force -Path "build/Release/SQL"
          New-Item -ItemType Directory -Force -Path "build/Release/SVG"
          
          # Copy asset contents into the executable runtime directory
          if (Test-Path "SQL") { Copy-Item -Path "SQL\*" -Destination "build\Release\SQL" -Recurse -Force }
          if (Test-Path "SVG") { Copy-Item -Path "SVG\*" -Destination "build\Release\SVG" -Recurse -Force }

      - name: Archive Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/Release/*" -DestinationPath "build/List-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: build/List-Windows.zip
