name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download SQLite3 Windows Binaries
        run: |
          # 1. Create a dedicated directory for SQLite binaries and headers
          New-Item -ItemType Directory -Force -Path "C:\sqlite3"
          
          # 2. Download the 64-bit Windows SQLite DLL and Amalgamation (for headers)
          Invoke-WebRequest -Uri "https://sqlite.org" -OutFile "C:\sqlite3\sqlite-dll.zip"
          Invoke-WebRequest -Uri "https://sqlite.org" -OutFile "C:\sqlite3\sqlite-amal.zip"
          
          # 3. Extract the contents using native Windows PowerShell utility
          Expand-Archive -Path "C:\sqlite3\sqlite-dll.zip" -DestinationPath "C:\sqlite3" -Force
          Expand-Archive -Path "C:\sqlite3\sqlite-amal.zip" -DestinationPath "C:\sqlite3\temp" -Force
          
          # 4. Clean up folder structure: move .h headers out of subfolder to root C:\sqlite3
          Move-Item -Path "C:\sqlite3\temp\sqlite-amalgamation-*\*.h" -Destination "C:\sqlite3" -Force
          Remove-Item -Recurse -Force "C:\sqlite3\temp", "C:\sqlite3\*.zip"
          
          # 5. Generate the essential sqlite3.lib file using the MSVC tools initialized earlier
          cd C:\sqlite3
          lib /def:sqlite3.def /machine:x64 /out:sqlite3.lib

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja 
          -DCMAKE_BUILD_TYPE=Release 
          -DSQLITE3_INCLUDE_DIR="C:/sqlite3" 
          -DSQLITE3_LIBRARY="C:/sqlite3/sqlite3.lib"
#        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt
        shell: pwsh
        run: |
          mkdir release
          Copy-Item "build/List.exe" "release/"
          Copy-Item "scryfall-card-image-urls.csv" "release/"
          
          windeployqt `
            --release `
            --qmldir . `
            "release/List.exe"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: release/
