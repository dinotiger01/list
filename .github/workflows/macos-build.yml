name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download SQLite3 Windows Binaries
        run: |
          # Create an absolute dependencies directory
          New-Item -ItemType Directory -Force -Path "C:\sqlite3"
          
          # Download the official public source amalgamation code 
          Invoke-WebRequest -Uri "https://sqlite.org" -OutFile "C:\sqlite3\sqlite.zip"
          Expand-Archive -Path "C:\sqlite3\sqlite.zip" -DestinationPath "C:\sqlite3\temp" -Force
          
          # Flatten the files cleanly to C:\sqlite3 without running sensitive .exe build commands
          Move-Item -Path "C:\sqlite3\temp\sqlite-amalgamation-*\*" -Destination "C:\sqlite3" -Force
          Remove-Item -Recurse -Force "C:\sqlite3\temp", "C:\sqlite3\sqlite.zip"

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja 
          -DCMAKE_BUILD_TYPE=Release 
          -DSQLITE3_INCLUDE_DIR="C:/sqlite3" 
          -DSQLITE3_LIBRARY="C:/sqlite3/sqlite3.lib"
#        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt
        shell: pwsh
        run: |
          mkdir release
          Copy-Item "build/List.exe" "release/"
          Copy-Item "scryfall-card-image-urls.csv" "release/"
          
          windeployqt `
            --release `
            --qmldir . `
            "release/List.exe"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: release/
