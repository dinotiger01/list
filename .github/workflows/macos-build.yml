name: MacOS Qt/CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 and Dependencies via Homebrew
        run: |
          brew update
          # Installs native macOS Qt6 (includes Core, Gui, Quick, Sql, Svg, etc.)
          brew install cmake qt@6 sqlite
          
          # Add Qt binaries to the runner environment path for macdeployqt
          echo "/opt/homebrew/opt/qt@6/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          mkdir build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/qt@6

      - name: Build Application
        run: |
          cmake --build build --config Release

      - name: Deploy and Bundle Qt Dependencies
        run: |
          # 1. Create a workspace right inside the Homebrew cellar prefix
          cp -R build/List.app /opt/homebrew/opt/qt@6/List.app

          # 2. Run macdeployqt directly in that environment layout
          /opt/homebrew/opt/qt@6/bin/macdeployqt /opt/homebrew/opt/qt@6/List.app -qmldir=QML -always-overwrite

          # 3. Move the fully bundled standalone app back out to your build directory
          mv /opt/homebrew/opt/qt@6/List.app build/List.app
      
      

      - name: Archive macOS Build
        run: |
          cd build
          zip -r List-macOS.zip List.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: List-macOS
          path: build/List-macOS.zip
