name: Windows Qt/CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          cache: true

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y

      - name: Install SQLite via vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-cache"

          $env:VCPKG_DEFAULT_BINARY_CACHE="${{ github.workspace }}/vcpkg-cache"

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-mingw-dynamic

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Application
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Find executable
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter "*.exe"

      - name: Deploy Qt
        shell: pwsh
        run: |
          $exePath = "${{ github.workspace }}/build/List.exe"

          if (!(Test-Path $exePath)) {
            Write-Error "List.exe was not found!"
            exit 1
          }

          windeployqt `
            --release `
            --qmldir "${{ github.workspace }}/QML" `
            "$exePath"

      - name: Copy Assets
        shell: pwsh
        run: |
          if (Test-Path "SQL") {
            Copy-Item `
              -Path "SQL" `
              -Destination "build/SQL" `
              -Recurse `
              -Force
          }

          if (Test-Path "SVG") {
            Copy-Item `
              -Path "SVG" `
              -Destination "build/SVG" `
              -Recurse `
              -Force
          }

      - name: Archive Windows Build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/*" `
            -DestinationPath "build/List-Windows.zip" `
            -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: List-Windows
          path: build/List-Windows.zip